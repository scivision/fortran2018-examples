name: cmake

on:
  push:
    paths:
      - "**.f90"
      - "**.F90"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/cmake.yml"
  workflow_dispatch:

# avoid wasted runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:


  gcc-new:
    timeout-minutes: 10

    strategy:
      matrix:
        fc: [12, 13, 14]

    runs-on: ubuntu-24.04

    env:
      FC: gfortran-${{ matrix.fc }}

    steps:
    - &checkout
      uses: actions/checkout@v6

    - if: matrix.fc >= 14
      run: cmake --workflow debug

    - &default
      run: cmake --workflow default


  gcc-old:
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-22.04]
        gcc-version: [10, 11]
  # gfortran-9 works, dropped to save CI time

    runs-on: ${{ matrix.os }}

    env:
      FC: gfortran-${{ matrix.gcc-version }}

    steps:

    - name: GCC APT
      if: matrix.gcc-version < 10
      run: |
        sudo apt update -y
        sudo apt install -y --no-install-recommends gfortran-${{ matrix.gcc-version }}

    - *checkout

    - *default

  macos:
    timeout-minutes: 15

    strategy:
      matrix:
        fc: [gfortran-15, flang]

    runs-on: macos-latest

    env:
      FC: ${{ matrix.fc }}
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
    - &checkout
      uses: actions/checkout@v6

    - if: matrix.fc == 'flang'
      run: brew install flang

    - run: cmake --workflow debug

    - *default


  windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: gcc
        version: 15

    - *checkout

    - *default
